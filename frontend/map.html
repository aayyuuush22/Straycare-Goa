<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Map & Heatmap | StrayCare Goa</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/map.css">
</head>


<body>

  <!-- Navigation -->
  <div id="nav-container"></div>


  <main class="map-page">

    <div class="container">

      <!-- =================================================
           MAP HEADER
           ================================================= -->

      <section class="map-top-card">

        <div class="map-header">

          <div class="map-title-area">

            <div class="map-title-icon">
              🗺️
            </div>

            <div>

              <span class="page-label">
                STRAYCARE GOA
              </span>

              <h1>Map & Heatmap</h1>

              <p>
                Explore stray animal reports and reported rabies
                cases across Goa.
              </p>

            </div>

          </div>


          <!-- View Toggle -->

          <div class="map-toggle">

            <button
              id="view-markers-btn"
              class="btn-small active-toggle"
              type="button"
            >
              📍 Pin View
            </button>

            <button
              id="view-heatmap-btn"
              class="btn-small"
              type="button"
            >
              🔥 Heatmap
            </button>

          </div>

        </div>


        <!-- =================================================
             LEGEND
             ================================================= -->

        <div class="map-legend">

          <div class="legend-item">
            <span
              class="legend-dot stray-dot"
            ></span>

            <span>Stray animal reports</span>
          </div>


          <div class="legend-item">
            <span
              class="legend-dot rabies-dot"
            ></span>

            <span>Rabies cases</span>
          </div>


          <div class="legend-update">
            <span class="live-dot"></span>
            Updates automatically
          </div>

        </div>

      </section>


      <!-- =================================================
           MAP
           ================================================= -->

      <section class="map-container-card">
        <div id="map" class="map-box"></div>
        <a id="maptoolkit-attribution" href="https://www.maptoolkit.org/" target="_blank" rel="noopener noreferrer" aria-label="Map tiles by Maptoolkit">
          <img src="https://www.maptoolkit.org/assets/maptoolkit-attribution.png" alt="Maptoolkit">
        </a>

      </section>


      <!-- =================================================
           PIN DETAILS
           ================================================= -->

      <div
        id="pin-details"
        class="card hidden"
      ></div>


      <!-- Small information note -->

      <div class="map-info">

        <span class="info-icon">
          ℹ️
        </span>

        <p>
          Select a marker on the map to view more information
          about that report.
        </p>

      </div>

    </div>

  </main>


  <!-- App helpers must be available before map.js. -->
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    // Try a second CDN if the primary MapLibre host is unavailable. Load the
    // library, THEN map.js, so map.js never runs before maplibregl exists.
    function loadScript(sources, onReady) {
      const [source, ...fallbacks] = sources;
      const script = document.createElement('script');
      script.src = source;
      script.onload = onReady;
      script.onerror = () => {
        if (fallbacks.length) {
          loadScript(fallbacks, onReady);
        } else {
          document.getElementById('map').innerHTML =
            '<p class="map-load-error">The map library could not be loaded. Check your internet connection and refresh.</p>';
          console.error('MapLibre GL could not be loaded from either CDN.');
        }
      };
      document.body.appendChild(script);
    }

    function loadApp() {
      const app = document.createElement('script');
      app.src = 'js/map.js?v=5';
      app.onerror = () => {
        document.getElementById('map').innerHTML =
          '<p class="map-load-error">The map could not be loaded. Check your internet connection and refresh.</p>';
        console.error('map.js failed to load.');
      };
      document.body.appendChild(app);
    }

    loadScript([
      'https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js',
      'https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'
    ], loadApp);
  </script>

</body>

</html>
