<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up | StrayCare Goa</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>

  <div class="auth-wrapper">

    <!-- Decorative background -->
    <div class="auth-decoration decoration-one"></div>
    <div class="auth-decoration decoration-two"></div>

    <div class="auth-card card">

      <!-- Logo / Brand -->
      <div class="auth-brand">
        <div class="brand-icon">🐾</div>

        <div>
          <div class="brand-name">StrayCare</div>
          <div class="brand-location">Goa</div>
        </div>
      </div>

      <!-- Heading -->
      <div class="auth-heading">
        <h1>Create your account</h1>
        <p>Join the community and help make pet care better.</p>
      </div>

      <!-- Signup Form -->
      <form id="signup-form">

        <div class="form-group">
          <label for="role">I am a...</label>

          <div class="select-wrapper">
            <select id="role" required>
              <option value="owner">🐶 Pet Owner</option>
              <option value="ngo">🏢 NGO</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="name">Full Name</label>

          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="name"
              placeholder="Enter your full name"
              required
            >
          </div>
        </div>

        <div class="form-group hidden" id="ngo-name-group">
          <label for="ngoName">NGO Name</label>

          <div class="input-wrapper">
            <span class="input-icon">🏢</span>
            <input
              type="text"
              id="ngoName"
              placeholder="Enter NGO name"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>

          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              placeholder="Create a password"
              required
              minlength="6"
            >
          </div>

          <small class="password-hint">
            Use at least 6 characters
          </small>
        </div>

        <button type="submit" class="btn signup-btn">
          Create Account
          <span class="btn-arrow">→</span>
        </button>

        <p id="signup-error" class="error-text hidden"></p>

      </form>

      <!-- Login -->
      <p class="login-text">
        Already have an account?
        <a href="index.html">Log in</a>
      </p>

      <!-- Small footer -->
      <div class="auth-footer">
        <span>🐾</span>
        Caring for pets. Caring for Goa.
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
